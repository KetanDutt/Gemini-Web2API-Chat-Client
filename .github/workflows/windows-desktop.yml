name: GlassGem CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  build-windows:
    name: Package GlassGem for Windows
    # Packaging only runs for tags / manual dispatch, keeping PRs fast.
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build Windows desktop artifacts
        run: npm run desktop:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: glassgem-windows
          path: release/*
          if-no-files-found: error
          retention-days: 14
